# ===============================
# Application
# ===============================
spring.application.name=ai-fraud-detection


# ===============================
# MySQL Database
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/payment_platform
spring.datasource.username=root
spring.datasource.password=innobliss123$
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# Server
# ===============================
server.port=8098

spring.data.redis.host=localhost
spring.data.redis.port=6379


spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=fraud-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=com.fraud.detection.dto.request.PaymentCreatedEvent

spring.kafka.consumer.properties.spring.json.trusted.packages=com.fraud.detection.dto.request,com.fraud.detection,com.payment.platform
spring.kafka.producer.properties.spring.json.add.type.headers=false
logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka=INFO


